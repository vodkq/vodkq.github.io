<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOMI — Hub & Links</title>
<meta name="description" content="LOMI: коллекция цифровых ссылок и креативное пространство.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23e8552b'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23f3ebdd'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{--bg:#f3ebdd;--ink:#1b1a17;--mut:#6b6558;--acc:#e8552b;--mint:#2f7d6b;--sun:#f2b632;--card:#fbf6ea;--px:8px;
--sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--pix:"Pixelify Sans",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--ink:#f3ebdd;--mut:#a39b8a;--acc:#ff7a4d;--mint:#4fb59d;--card:#211e16}}
:root[data-theme="dark"]{--bg:#17150f;--ink:#f3ebdd;--mut:#a39b8a;--acc:#ff7a4d;--mint:#4fb59d;--card:#211e16}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--sans);overflow-x:hidden}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0;font-family:var(--pix)}
.brand{text-decoration:none;font-size:20px;line-height:1.1}.brand small{display:block;font-size:13px;color:var(--mut)}
header.top nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-family:var(--pix);font-size:16px;background:var(--card);color:var(--ink);border:3px solid var(--ink);padding:6px 14px;cursor:pointer;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .12s steps(2),box-shadow .12s steps(2)}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--acc);color:#1b1a17}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,5vw,64px);align-items:center;padding:clamp(24px,6vw,64px) 0 clamp(36px,7vw,80px)}
.hero.solo{grid-template-columns:1fr}
.tag{display:inline-block;font-family:var(--pix);color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-size:15px}
h1{font-size:clamp(38px,6.6vw,88px);line-height:.98;letter-spacing:-.03em;margin:.2em 0 .3em;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(var(--sun),var(--sun)) 0 88%/100% .28em no-repeat;color:var(--ink)}
.lead{max-width:38ch;color:var(--mut);font-size:clamp(17px,2vw,21px)}
#scene{width:100%;height:auto;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--acc);background:#bfe3da;transition:transform .2s ease-out}
.divider{height:var(--px);background:repeating-linear-gradient(90deg,var(--ink) 0 var(--px),transparent var(--px) calc(var(--px)*2))}
section{padding:clamp(32px,6vw,72px) 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px;font-family:var(--pix)}
.sh h2{margin:0;font-size:22px;color:var(--mint);font-weight:500}.sh span{color:var(--mut)}
.links{display:flex;gap:16px}
.link{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:3px solid var(--ink);text-decoration:none;box-shadow:5px 5px 0 var(--ink);transition:box-shadow .12s steps(2),background .12s}
.link:hover,.link:focus-visible{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--acc);background:var(--sun);color:#1b1a17}
.link:hover .dom,.link:hover p{color:#1b1a17}
.row{display:flex;justify-content:space-between;align-items:center}
.ico{width:44px;height:44px;display:grid;place-items:center;border:3px solid var(--ink);flex:none}
.ico svg{width:24px;height:24px;fill:#fff}
.dom{font-family:var(--pix);font-size:14px;color:var(--mut)}
.link h3{margin:0;font-size:22px;font-weight:800}
.link p{margin:0;font-size:15px;color:var(--mut);line-height:1.4}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cc{padding:22px;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.cc.gold{box-shadow:5px 5px 0 var(--sun)}
.cc .row{justify-content:flex-start;gap:16px;margin-bottom:12px}
.cc .ico{width:52px;height:52px;font-size:26px;background:var(--sun)}
.cc h3{margin:0;font-size:24px}.cc small{font-family:var(--pix);font-size:14px;color:var(--mut)}.cc p{margin:0}
footer{padding:32px 0 56px;font-family:var(--pix);color:var(--mut);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s steps(6)}
.rv.in{opacity:1;transform:none}
#scene{cursor:pointer}
.cube-wrap{perspective:700px;display:grid;place-items:center;justify-content:start;height:130px;margin-top:20px;width:120px}
.cube{width:72px;height:72px;position:relative;transform-style:preserve-3d;cursor:grab;touch-action:none}
.cube i{position:absolute;inset:0;display:grid;place-items:center;border:3px solid var(--ink);font:normal 24px var(--pix);color:#1b1a17}
.cube i:nth-child(1){transform:translateZ(36px);background:var(--acc)}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(36px);background:var(--sun)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(36px);background:#6fd0c0}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(36px);background:#2aabee}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(36px);background:#fbf6ea}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(36px);background:#8bd16b}
@media (max-width:980px){.links{flex-wrap:wrap}.link{flex:1 1 220px}}
@media (max-width:760px){.hero{grid-template-columns:1fr}.cg{grid-template-columns:1fr}body{font-size:17px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
const T={
ru:{navLinks:"Ссылки",navThanks:"Благодарности",badge:"Веб-дизайнер",
heroTitle:"Коллекция <em>цифровых ссылок</em>.",
heroSubtitle:"Подборка моих ненужных ресурсов, проектов и платформ, собранных в едином интерфейсе",
sectionTitle:"Мои профили",linksCount:"4 ресурса",cardTelegram:"Личный канал, блог и так далее",cardGithub:"Мои проекты и репозитории",cardYoutube:"Видео, да и всё",cardPinterest:"Красивые картинки",
thanksBadge:"Благодарности",thanksTitle:"Признание и <em>благодарность</em>.",thanksSubtitle:"Отдельное спасибо Брату и всем, кто помогает.",
brutName:"Брат",brutRole:"Главный инвестор",brutText:"Особая благодарность Брату за неоценимую помощь, поддержку и вклад в этот проект.",
allHelpersTitle:"Все, кто помогает",allHelpersRole:"Сообщество, друзья и родственники",allHelpersText:"Спасибо всем, кто помогает",
footerDesign:"Сделано с точностью"},
en:{navLinks:"Links",navThanks:"Credits",badge:"Web Designer",
heroTitle:"Curated <em>digital links</em>.",
heroSubtitle:"A collection of my unnecessary resources, projects, and platforms, gathered in a single interface.",
sectionTitle:"My Profiles",linksCount:"4 items",cardTelegram:"Personal channel, blog, etc.",cardGithub:"My projects and repositories",cardYoutube:"Videos, and that’s pretty much it",cardPinterest:"Beautiful pictures",
thanksBadge:"Credits",thanksTitle:"Honor & <em>gratitude</em>.",thanksSubtitle:"Special thanks to Brother and everyone who helps.",
brutName:"Brother",brutRole:"Lead Investor",brutText:"Huge thanks to Brother for the invaluable help, support, and contribution.",
allHelpersTitle:"Everyone who helps",allHelpersRole:"Community, friends, and family",allHelpersText:"Thanks to everyone who helps",
footerDesign:"Designed with precision"}};
let lang="en";
function setLang(l){lang=l;document.documentElement.lang=l;document.getElementById("lt").textContent=l==="ru"?"EN":"RU";
 document.querySelectorAll("[data-i18n]").forEach(e=>{const v=T[l][e.dataset.i18n];if(v)e.innerHTML=v})}
function show(p){const c=p==="credits";
 document.getElementById("p-links").hidden=c;document.getElementById("p-credits").hidden=!c;
 document.getElementById("n-links").setAttribute("aria-pressed",String(!c));document.getElementById("n-credits").setAttribute("aria-pressed",String(c));
 scrollTo(0,0)}
document.getElementById("n-links").onclick=()=>show("links");
document.getElementById("n-credits").onclick=()=>show("credits");
document.getElementById("lang").onclick=()=>setLang(lang==="ru"?"en":"ru");
document.getElementById("theme").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=(r.dataset.theme||(d?"dark":"light"))==="dark"?"light":"dark"};

/* Пиксельная сцена */
const MAP=["............................","..................oo........",".................oooo.......",".................oooo.......","..................oo........","........rr..................",".......rrrr......t..........","......rrrrrr....ttt.........","......hhhhhh...ttttt........","......hhdhhh.....b..........","ggggggggggggggggbggggggggggg","gGgggGgggGgggGggbgggGgggGggg","GGGGGGGGGGGGGGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGGGGGGGGGGGGGG"];
const COL={o:"#f2b632",r:"#e8552b",h:"#fbf6ea",d:"#1b1a17",t:"#2f7d6b",b:"#6b4a2b",g:"#5aa468",G:"#2f7d6b"};
const sc=document.getElementById("scene");let s="";
MAP.forEach((row,y)=>row.padEnd(28,".").split("").forEach((c,x)=>{if(COL[c])s+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${COL[c]}"${c==="o"?' data-sun="1"':""}/>`}));
sc.innerHTML=s;

/* Интерактив: один canvas для частиц, один rAF для указателя */
const still=matchMedia("(prefers-reduced-motion:reduce)").matches,fine=matchMedia("(pointer:fine)").matches;
const cv=document.createElement("canvas");cv.setAttribute("aria-hidden","true");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9";document.body.appendChild(cv);
const cx=cv.getContext("2d");let P=[],raf=0,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
size();addEventListener("resize",size);
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 for(let i=P.length-1;i>=0;i--){const p=P[i];if(--p.l<=0){P.splice(i,1);continue}
  p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;cx.globalAlpha=p.l/p.m;cx.fillStyle=p.c;cx.fillRect(p.x*dpr,p.y*dpr,p.s*dpr,p.s*dpr)}
 raf=P.length?requestAnimationFrame(tick):0}
function spawn(x,y,n,cols,sp,g){if(still)return;
 for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g,l:40,m:40,s:i%2?6:8,c:cols[i%cols.length]})}
 if(P.length>300)P.splice(0,P.length-300);if(!raf)raf=requestAnimationFrame(tick)}
const COLS=["#e8552b","#f2b632","#2f7d6b","#2aabee"],burst=(x,y,c)=>spawn(x,y,16,c||COLS,4,.18);

/* пейзаж: клик по солнцу — тема, по остальным пикселям — брызги их цвета */
sc.addEventListener("click",e=>{const f=e.target.getAttribute&&e.target.getAttribute("fill");
 if(e.target.dataset&&e.target.dataset.sun)document.getElementById("theme").click();burst(e.clientX,e.clientY,f?[f]:null)});
document.querySelectorAll(".btn").forEach(b=>b.addEventListener("click",e=>{if(e.isTrusted)burst(e.clientX,e.clientY)}));

/* видимость: тяжёлые анимации идут только на экране */
let sceneVis=true,cubeVis=true,cl=0;
const cube=document.querySelector(".cube");let rx=-20,ry=30,vx=0,vy=.4,drag=false,lx=0,ly=0;
function loop(){cl=0;if(!drag){ry+=vx*0+vy;rx+=vx;vx*=.95;vy=Math.abs(vy)<.4?(vy<0?-.4:.4):vy*.95}
 cube.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;if(!still&&cubeVis&&!document.hidden)cl=requestAnimationFrame(loop)}
new IntersectionObserver(es=>es.forEach(e=>{if(e.target===sc)sceneVis=e.isIntersecting;else{cubeVis=e.isIntersecting;if(cubeVis&&!cl)loop()}})).observe(sc);
{const vo=new IntersectionObserver(es=>es.forEach(e=>{cubeVis=e.isIntersecting;if(cubeVis&&!cl)loop()}));vo.observe(cube)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!cl)loop()});
loop();

/* куб: тяните, чтобы вращать; прокрутка тоже раскручивает */
cube.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;cube.setPointerCapture(e.pointerId);cube.style.cursor="grabbing"});
cube.addEventListener("pointermove",e=>{if(!drag)return;vy=(e.clientX-lx)*.5;vx=-(e.clientY-ly)*.5;ry+=vy;rx+=vx;lx=e.clientX;ly=e.clientY});
addEventListener("pointerup",()=>{drag=false;cube.style.cursor="grab"});
cube.addEventListener("click",e=>burst(e.clientX,e.clientY));

/* указатель: наклон пейзажа и карточек + след — всё в одном rAF */
let mx=0,my=0,pend=0,last=0,hov=null;
function frame(t){pend=0;
 if(sceneVis)sc.style.transform=`perspective(900px) rotateY(${(mx/innerWidth-.5)*18}deg) rotateX(${-(my/innerHeight-.5)*14}deg)`;
 if(hov){const r=hov.getBoundingClientRect(),x=(mx-r.left)/r.width-.5,y=(my-r.top)/r.height-.5;hov.style.transform=`perspective(600px) rotateX(${-y*14}deg) rotateY(${x*14}deg) translate(3px,3px)`}
 if(t-last>80){last=t;spawn(mx,my,1,["#e8552b"],.4,.05)}}
if(fine&&!still)addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;mx=e.clientX;my=e.clientY;if(!pend){pend=1;requestAnimationFrame(frame)}},{passive:true});
document.querySelectorAll(".link,.cc").forEach(c=>{
 c.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"&&!still){hov=c;c.style.willChange="transform"}});
 c.addEventListener("pointerleave",()=>{c.style.transform="";c.style.willChange="";hov=null});
 c.addEventListener("click",e=>burst(e.clientX,e.clientY))});

/* полоса прокрутки */
const bar=document.createElement("div");bar.style.cssText="position:fixed;top:0;left:0;height:6px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:10;pointer-events:none";document.body.appendChild(bar);
let sy=scrollY,sq=0;
addEventListener("scroll",()=>{const d=scrollY-sy;sy=scrollY;vy+=Math.max(-8,Math.min(8,d*.08));
 if(!sq){sq=1;requestAnimationFrame(()=>{sq=0;const m=document.documentElement.scrollHeight-innerHeight;bar.style.transform=`scaleX(${m>0?scrollY/m:0})`})}},{passive:true});

/* пасхалка: наберите «lomi» */
let kb="";addEventListener("keydown",e=>{if(e.key.length!==1)return;kb=(kb+e.key.toLowerCase()).slice(-4);
 if(kb==="lomi")for(let i=0;i<8;i++)setTimeout(()=>spawn(Math.random()*innerWidth,-10,6,COLS,1.5,.25),i*120)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".rv").forEach(n=>io.observe(n));
setLang("en");
if(location.hash==="#credits")show("credits");
</script>
